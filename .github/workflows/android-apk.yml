# Builds the Android APK on GitHub's machines (free for public repos) and publishes it
# as a Release, so friends always download the latest from one fixed link:
#   https://github.com/dvirshr/poker-night/releases/latest/download/poker-night.apk
#
# Signing: the APK is signed with YOUR keystore, kept as two repository secrets
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
# The same keystore must sign every version, otherwise phones refuse to update.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'app.json', 'package.json', 'assets/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://esfubeqfacuyrjylhjmc.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__h1qDYFh1_eRLb_ZrKg4-Q_6ONxptOZ
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD repository secrets"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Unit tests (money logic)
        run: npm test

      - name: Version from build number
        run: |
          node -e "
            const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));
            a.expo.version='0.1.${{ github.run_number }}';
            a.expo.android.versionCode=${{ github.run_number }};
            fs.writeFileSync('app.json',JSON.stringify(a,null,2));"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign with the project keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias poker \
            --ks-pass env:PW --key-pass env:PW \
            --out poker-night.apk android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs poker-night.apk | head -3
          rm release.keystore

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" poker-night.apk \
            --title "ערב פוקר $TAG" \
            --notes "להתקנה: להוריד את poker-night.apk בטלפון אנדרואיד ולפתוח. בפעם הראשונה צריך לאשר התקנה ממקור לא ידוע." \
            --latest
